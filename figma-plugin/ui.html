<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: var(--figma-color-bg); color: var(--figma-color-text); }
    .eyebrow { color: #1b8a74; font-size: 10px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 8px 0 0; font-size: 22px; letter-spacing: -.04em; }
    p { color: var(--figma-color-text-secondary); font-size: 11px; line-height: 1.6; }
    label { display: block; margin: 14px 0 6px; font-size: 10px; font-weight: 700; }
    input { width: 100%; border: 1px solid var(--figma-color-border); border-radius: 9px; background: var(--figma-color-bg-secondary); color: var(--figma-color-text); padding: 9px 10px; font-size: 10px; outline: none; }
    .scope { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .scope label { margin: 0; display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--figma-color-border); border-radius: 10px; padding: 10px; cursor: pointer; background: var(--figma-color-bg-secondary); }
    .scope label:has(input:checked) { border-color: #38b99d; background: color-mix(in srgb, #38b99d 12%, var(--figma-color-bg-secondary)); }
    .scope input { width: auto; margin: 0; accent-color: #16806d; }
    .scope strong { font-size: 11px; }
    .scope span { font-size: 10px; font-weight: 400; line-height: 1.4; color: var(--figma-color-text-secondary); }
    .notice { margin-top: 14px; border-radius: 10px; background: var(--figma-color-bg-secondary); padding: 10px; font-size: 10px; line-height: 1.5; color: var(--figma-color-text-secondary); }
    .progress { display: none; margin-top: 16px; border: 1px solid var(--figma-color-border); border-radius: 11px; padding: 11px; }
    .progress-row { display: flex; justify-content: space-between; gap: 12px; font-size: 10px; }
    .track { height: 5px; margin-top: 9px; overflow: hidden; border-radius: 999px; background: var(--figma-color-bg-tertiary); }
    .bar { height: 100%; width: 0; border-radius: inherit; background: #38b99d; transition: width .2s ease; }
    .error { display: none; margin-top: 12px; border-radius: 9px; background: #ffe8dc; color: #8b3218; padding: 10px; font-size: 10px; line-height: 1.5; }
    .actions { display: flex; gap: 8px; margin-top: 18px; }
    button { flex: 1; border: 0; border-radius: 10px; padding: 11px 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
    #export { background: #b8f7df; color: #143e34; }
    #cancel { background: var(--figma-color-bg-secondary); color: var(--figma-color-text-secondary); }
    button:disabled { cursor: default; opacity: .45; }
    .done { color: #16806d; font-weight: 700; }
  </style>
</head>
<body>
  <div class="eyebrow">Pass-Off plugin</div>
  <h1>Send frames to Pass-Off</h1>
  <p>Optional: select frames, components, or sections first. With nothing selected, Pass-Off uses the current page.</p>
  <div class="notice">Development destination: <strong>http://localhost:3000</strong><br />This uses Figma’s Plugin API and does not consume REST file or image requests.</div>
  <label>Export scope</label>
  <div class="scope" role="radiogroup" aria-label="Export scope">
    <label>
      <input type="radio" name="scope" value="high-level" checked />
      <strong>High level</strong>
      <span>Only top-level frames, components, and sections.</span>
    </label>
    <label>
      <input type="radio" name="scope" value="all" />
      <strong>All</strong>
      <span>Every nested frame, component, and section too.</span>
    </label>
  </div>
  <label for="project-key">Pass-Off project key</label>
  <input id="project-key" type="text" autocomplete="off" spellcheck="false" placeholder="UUID from /projects/… or slug" />
  <label for="plugin-key">Local plugin key</label>
  <input id="plugin-key" type="password" autocomplete="off" placeholder="paste hex value only" />
  <div id="progress" class="progress"><div class="progress-row"><span id="message">Preparing…</span><strong id="percent">0%</strong></div><div class="track"><div id="bar" class="bar"></div></div></div>
  <div id="error" class="error"></div>
  <div class="actions"><button id="cancel" type="button">Close</button><button id="export" type="button">Export frames</button></div>
  <script>
    const frames = [];
    let file = null;
    const exportButton = document.getElementById("export");
    const pluginKeyInput = document.getElementById("plugin-key");
    const projectKeyInput = document.getElementById("project-key");
    const progress = document.getElementById("progress");
    const message = document.getElementById("message");
    const percent = document.getElementById("percent");
    const bar = document.getElementById("bar");
    const errorBox = document.getElementById("error");

    function showProgress(text, value) {
      progress.style.display = "block";
      message.textContent = text;
      percent.textContent = `${Math.round(value)}%`;
      bar.style.width = `${Math.max(0, Math.min(100, value))}%`;
    }

    function normalizePluginKey(value) {
      let key = String(value || "").trim();
      // Allow pasting the whole .env assignment line.
      key = key.replace(/^PASSOFF_FIGMA_PLUGIN_KEY\s*=\s*/i, "").trim();
      if ((key.startsWith('"') && key.endsWith('"')) || (key.startsWith("'") && key.endsWith("'"))) {
        key = key.slice(1, -1).trim();
      }
      return key;
    }

    function normalizeProjectKey(value) {
      let key = String(value || "").trim();
      try {
        const url = new URL(key);
        const match = url.pathname.match(/\/projects\/([^/]+)/i);
        if (match && match[1]) key = decodeURIComponent(match[1]);
      } catch (_) {
        const match = key.match(/\/projects\/([^/?#]+)/i);
        if (match && match[1]) key = decodeURIComponent(match[1]);
      }
      return key.trim();
    }

    function bytesToBase64(value) {
      const bytes = value instanceof Uint8Array
        ? value
        : value instanceof ArrayBuffer
          ? new Uint8Array(value)
          : new Uint8Array(value || []);
      let binary = "";
      const size = 0x8000;
      for (let offset = 0; offset < bytes.length; offset += size) {
        binary += String.fromCharCode.apply(null, Array.from(bytes.subarray(offset, offset + size)));
      }
      return btoa(binary);
    }

    function showError(text) {
      errorBox.textContent = text;
      errorBox.style.display = "block";
      exportButton.disabled = false;
    }

    function selectedScope() {
      const checked = document.querySelector('input[name="scope"]:checked');
      return checked && checked.value === "all" ? "all" : "high-level";
    }

    function setScope(scope) {
      const value = scope === "all" ? "all" : "high-level";
      const input = document.querySelector(`input[name="scope"][value="${value}"]`);
      if (input) input.checked = true;
    }

    document.querySelectorAll('input[name="scope"]').forEach((input) => {
      input.addEventListener("change", () => {
        parent.postMessage({ pluginMessage: { type: "save-export-scope", scope: selectedScope() } }, "*");
      });
    });

    document.getElementById("cancel").onclick = () => parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
    exportButton.onclick = () => {
      frames.length = 0;
      file = null;
      errorBox.style.display = "none";
      message.className = "";
      exportButton.disabled = true;
      const scope = selectedScope();
      showProgress(scope === "all" ? "Preparing all nested frames" : "Preparing high-level frames", 2);
      parent.postMessage({ pluginMessage: { type: "export", scope } }, "*");
    };

    onmessage = async (event) => {
      const data = event.data.pluginMessage;
      if (!data) return;
      if (data.type === "plugin-key" && typeof data.pluginKey === "string") {
        pluginKeyInput.value = data.pluginKey;
      }
      if (data.type === "project-key" && typeof data.projectKey === "string") {
        projectKeyInput.value = data.projectKey;
      }
      if (data.type === "export-scope") setScope(data.scope);
      if (data.type === "started") {
        file = data.file;
        showProgress(`Found ${data.total} frame${data.total === 1 ? "" : "s"}`, 5);
      }
      if (data.type === "progress") showProgress(data.message, 5 + (data.index / Math.max(1, data.total)) * 65);
      if (data.type === "frame") {
        try {
          frames.push({
            id: data.frame.id,
            name: data.frame.name,
            type: data.frame.type,
            x: data.frame.x,
            y: data.frame.y,
            width: data.frame.width,
            height: data.frame.height,
            restJson: data.frame.restJson,
            pngBase64: bytesToBase64(data.frame.pngBytes),
          });
          showProgress(`Prepared ${data.index + 1} of ${data.total} frames`, 5 + ((data.index + 1) / Math.max(1, data.total)) * 65);
        } catch (error) {
          showError(error instanceof Error ? error.message : String(error));
        }
      }
      if (data.type === "ready") {
        try {
          file = data.file || file;
          const pluginKey = normalizePluginKey(pluginKeyInput.value);
          if (!pluginKey) throw new Error("Paste the hex value from PASSOFF_FIGMA_PLUGIN_KEY in your local .env file.");
          pluginKeyInput.value = pluginKey;
          parent.postMessage({ pluginMessage: { type: "save-plugin-key", pluginKey } }, "*");
          const projectKey = normalizeProjectKey(projectKeyInput.value);
          if (!projectKey) throw new Error("Paste the Pass-Off project key from the dashboard URL (/projects/<id>) or use the project slug.");
          projectKeyInput.value = projectKey;
          parent.postMessage({ pluginMessage: { type: "save-project-key", projectKey } }, "*");
          if (!file || typeof file.key !== "string" || !file.key || typeof file.name !== "string") {
            throw new Error("The plugin could not determine the Figma file. Re-run the plugin from a cloud Figma file, or reload the local plugin from manifest.");
          }
          if (!frames.length) {
            throw new Error("No frames were prepared for export. Select a frame and try again.");
          }

          const batchSize = 40;
          const batches = [];
          for (let start = 0; start < frames.length; start += batchSize) {
            batches.push(frames.slice(start, start + batchSize));
          }

          let payload = null;
          for (let index = 0; index < batches.length; index += 1) {
            const mode = index === 0 ? "replace" : "append";
            showProgress(`Saving batch ${index + 1} of ${batches.length} to Pass-Off`, 70 + ((index + 1) / batches.length) * 28);
            const response = await fetch("http://localhost:3000/api/integrations/figma/plugin-import", {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-Passoff-Plugin-Key": pluginKey },
              body: JSON.stringify({ file, frames: batches[index], mode, pluginKey, projectKey }),
            });
            payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.error || `Pass-Off rejected import batch ${index + 1}.`);
          }

          const projectLabel = payload.projectName || payload.projectKey || projectKey;
          showProgress(`Saved ${payload.previewCount} previews · ${payload.interactionCount} interactions → ${projectLabel}`, 100);
          message.className = "done";
          exportButton.textContent = "Export again";
          exportButton.disabled = false;
        } catch (error) {
          showError(error instanceof Error ? error.message : String(error));
        }
      }
      if (data.type === "error") showError(data.message);
    };
  </script>
</body>
</html>
